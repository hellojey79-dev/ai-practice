<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 AI 웹페이지</title>
  <style>
    body {
      background-color: #ffffff;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      max-width: 540px;
      width: 100%;
      text-align: center;
      padding: 40px 30px;
      border: 1px solid #eaeaea;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 24px;
      color: #111111;
    }
    .intro-text {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #555555;
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>나의 첫 AI 웹페이지</h1>
    <p class="intro-text">안녕하세요! AI와 함께 첫 웹페이지를 만들어보고 있습니다.</p>
    <p class="intro-text">인공지능 코딩 어시스턴트를 활용해 쉽고 빠르게 아이디어를 구현하는 중입니다.</p>
    <p class="intro-text">앞으로 다양한 프로젝트를 하나씩 완성해 나가는 것이 목표입니다.</p>
  </div>
</body>
</html>
